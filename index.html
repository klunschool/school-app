    <div style={{display:"flex",flexDirection:"column",gap:12}}>
      <div style={{background:C.white,borderRadius:16,padding:16,boxShadow:"0 2px 8px rgba(0,0,0,0.07)"}}>
        <div style={{fontSize:17,fontWeight:900,color:C.navy}}>👪 รายงานผู้ปกครองประจำห้อง</div>
        <div style={{fontSize:12,color:C.g400,marginTop:2}}>ดูว่านักเรียนคนไหนผูกบัญชีผู้ปกครองแล้วหรือยังไม่ผูก</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginTop:12}}>
          <div style={{background:C.g50,borderRadius:12,padding:10}}><div style={{fontSize:20,fontWeight:900,color:C.navy}}>{visible.length}</div><div style={{fontSize:11,color:C.g600,fontWeight:800}}>นักเรียน</div></div>
          <div style={{background:C.greenL,borderRadius:12,padding:10}}><div style={{fontSize:20,fontWeight:900,color:C.green}}>{linked}</div><div style={{fontSize:11,color:C.g600,fontWeight:800}}>ผูกแล้ว</div></div>
          <div style={{background:C.redL,borderRadius:12,padding:10}}><div style={{fontSize:20,fontWeight:900,color:C.red}}>{notLinked}</div><div style={{fontSize:11,color:C.g600,fontWeight:800}}>ยังไม่ผูก</div></div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:7,marginTop:12}}>
          {chip("ทุกห้อง",classId==="all",()=>setClassId("all"))}
          {classes.map(c=><React.Fragment key={c.id}>{chip(c.name,String(classId)===String(c.id),()=>setClassId(String(c.id)))}</React.Fragment>)}
        </div>
      </div>
      <div style={{background:C.white,borderRadius:16,padding:14,boxShadow:"0 2px 8px rgba(0,0,0,0.07)"}}>
        <div style={{fontSize:14,fontWeight:900,color:C.navy,marginBottom:8}}>สรุปตามห้อง</div>
        {classSummary.filter(c=>classId==="all"||String(c.id)===classId).map(c=><div key={c.id} style={{display:"grid",gridTemplateColumns:"1.2fr 0.8fr 0.8fr 0.8fr",gap:6,padding:"9px 0",borderBottom:`1px solid ${C.g100}`,alignItems:"center"}}>
          <div style={{fontSize:13,fontWeight:900,color:C.navy}}>{c.name}</div>
          <div style={{fontSize:12,color:C.g600}}>นร. {c.total}</div>
          <div style={{fontSize:12,color:C.green,fontWeight:900}}>ผูก {c.linked}</div>
          <div style={{fontSize:12,color:C.red,fontWeight:900}}>ยัง {c.missing}</div>
        </div>)}
      </div>
      <div style={{background:C.white,borderRadius:16,padding:14,boxShadow:"0 2px 8px rgba(0,0,0,0.07)"}}>
        <div style={{fontSize:14,fontWeight:900,color:C.navy,marginBottom:8}}>รายชื่อนักเรียน</div>
        {visible.length===0?<Empty icon="👪" msg="ไม่พบนักเรียนในห้องที่เลือก"/>:visible.map(s=>{
          const parents=linkMap[s.id]||[];
          const ok=parents.length>0;
          return <div key={s.id} style={{display:"flex",justifyContent:"space-between",gap:10,padding:"10px 0",borderBottom:`1px solid ${C.g100}`}}>
            <div style={{minWidth:0}}>
              <div style={{fontSize:13,fontWeight:900,color:C.navy}}>{s.full_name}</div>
              <div style={{fontSize:11,color:C.g400}}>{s.classes?.name||"-"} · เลขที่ {s.student_no||"-"}</div>
              {ok&&<div style={{fontSize:11,color:C.green,marginTop:3,fontWeight:800}}>ผู้ปกครอง: {parents.map(p=>p.parent_name||"ไม่ระบุชื่อ").join(", ")}</div>}
            </div>
            <span style={{alignSelf:"center",background:ok?C.greenL:C.redL,color:ok?C.green:C.red,borderRadius:99,padding:"4px 9px",fontSize:11,fontWeight:900,whiteSpace:"nowrap"}}>{ok?"ผูกแล้ว":"ยังไม่ผูก"}</span>
          </div>;
        })}
      </div>
    </div>
  );
}

function ParentUsageReport({token}){
  const [rows,setRows]=useState([]);
  const [classId,setClassId]=useState("all");
  const [loading,setLoading]=useState(true);
  useEffect(()=>{
    const load=async()=>{
      setLoading(true);
      const data=await sbFetch("rpc/teacher_parent_usage_report",{method:"POST",token,body:"{}"}).catch(()=>[]);
      setRows(data||[]);
      setLoading(false);
    };
    load();
  },[token]);
  if(loading)return <Spin/>;
  const classes=Array.from(new Map(rows.map(r=>[r.class_id,{id:r.class_id,name:r.class_name}]).filter(x=>x[0])).values())
    .sort((a,b)=>classSortValue(a.name)-classSortValue(b.name)||String(a.name).localeCompare(String(b.name),"th"));
  const visible=classId==="all"?rows:rows.filter(r=>String(r.class_id)===classId);
  const studentIds=new Set(visible.map(r=>r.student_id));
  const linked=visible.filter(r=>r.parent_id).length;
  const signedIn=visible.filter(r=>r.parent_id&&r.last_sign_in_at).length;
  const never=visible.filter(r=>r.parent_id&&!r.last_sign_in_at).length;
  const card=(label,value,color=C.navy)=><div style={{background:C.white,borderRadius:14,padding:12,boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}}>
    <div style={{fontSize:22,fontWeight:900,color}}>{value}</div>
    <div style={{fontSize:12,fontWeight:800,color:C.navy,marginTop:2}}>{label}</div>
  </div>;
  return(
    <div style={{display:"flex",flexDirection:"column",gap:12}}>
      <div style={{background:C.white,borderRadius:16,padding:16,boxShadow:"0 2px 8px rgba(0,0,0,0.07)"}}>
        <div style={{fontSize:17,fontWeight:900,color:C.navy}}>📱 รายงานการเข้าใช้งานผู้ปกครอง</div>
        <div style={{fontSize:12,color:C.g400,marginTop:2}}>ดูว่าผู้ปกครองผูกบัญชีแล้วหรือยัง และเข้าใช้งานล่าสุดเมื่อไหร่</div>
        <select value={classId} onChange={e=>setClassId(e.target.value)} style={{width:"100%",marginTop:12,padding:"10px 12px",borderRadius:10,border:`1.5px solid ${C.g200}`,background:C.white,fontSize:14,fontWeight:800,color:C.navy}}>
          <option value="all">ทุกห้องเรียน</option>
          {classes.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
        </select>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:10}}>
        {card("นักเรียน",studentIds.size,C.navy)}
        {card("บัญชีผู้ปกครอง",linked,C.green)}
        {card("เคยเข้าใช้",signedIn,C.gold)}
        {card("ยังไม่เคยเข้า",never,C.red)}
      </div>
      <div style={{background:C.white,borderRadius:16,padding:14,boxShadow:"0 2px 8px rgba(0,0,0,0.07)"}}>
        <div style={{fontSize:14,fontWeight:900,color:C.navy,marginBottom:8}}>รายชื่อผู้ปกครอง</div>
        {visible.length===0?<Empty icon="📱" msg="ไม่พบข้อมูลในห้องที่เลือก"/>:visible.map((r,i)=>{
          const hasParent=!!r.parent_id;
          const hasLogin=!!r.last_sign_in_at;
          return <div key={`${r.student_id}-${r.parent_id||"none"}-${i}`} style={{padding:"10px 0",borderBottom:`1px solid ${C.g100}`}}>
            <div style={{display:"flex",justifyContent:"space-between",gap:8,alignItems:"flex-start"}}>
              <div style={{minWidth:0}}>
                <div style={{fontSize:13,fontWeight:900,color:C.navy}}>{r.student_name||"-"}</div>
                <div style={{fontSize:11,color:C.g400}}>{r.class_name||"-"} · เลขที่ {r.student_no||"-"}</div>
                <div style={{fontSize:12,color:hasParent?C.g700:C.red,marginTop:5,fontWeight:800}}>
                  {hasParent?(r.parent_name||r.parent_email||"ไม่ระบุชื่อผู้ปกครอง"):"ยังไม่ผูกผู้ปกครอง"}
                </div>
                {hasParent&&<div style={{fontSize:11,color:C.g400,marginTop:2}}>{r.parent_email||"-"}</div>}
              </div>
              <span style={{background:!hasParent?C.redL:hasLogin?C.greenL:C.yellowL,color:!hasParent?C.red:hasLogin?C.green:C.yellow,borderRadius:99,padding:"4px 8px",fontSize:11,fontWeight:900,whiteSpace:"nowrap"}}>
                {!hasParent?"ยังไม่ผูก":hasLogin?"เข้าแล้ว":"ยังไม่เข้า"}
              </span>
            </div>
            {hasParent&&<div style={{fontSize:11,color:C.g600,marginTop:6}}>
              ยืนยันบัญชี: {r.confirmed_at?formatThaiDateTime(r.confirmed_at):"ยังไม่ยืนยัน"} · เข้าใช้ล่าสุด: {r.last_sign_in_at?formatThaiDateTime(r.last_sign_in_at):"ยังไม่เคยเข้า"}
            </div>}
          </div>;
        })}
      </div>
    </div>
  );
}

// ======= ADMIN STUDENT MANAGEMENT =======
function AdminStudentManagement({token}){
  const [classes,setClasses]=useState([]);
  const [students,setStudents]=useState([]);
  const [fromClass,setFromClass]=useState("");
  const [toClass,setToClass]=useState("");
  const [selected,setSelected]=useState([]);
  const [query,setQuery]=useState("");
  const [manageClass,setManageClass]=useState("");
  const [editing,setEditing]=useState(null);
  const [photoDraft,setPhotoDraft]=useState(null);
  const [loading,setLoading]=useState(true);
  const [busy,setBusy]=useState("");
  const load=useCallback(async()=>{
    setLoading(true);
    const [cls,stu]=await Promise.all([
      sbFetch("classes?select=id,name&order=id.asc",{token}).catch(()=>[]),
      sbFetch("students?select=id,full_name,student_no,class_id,student_id_no,photo_path,classes(name)&order=class_id.asc,student_no.asc",{token}).catch(()=>[])
    ]);
    const sortedClasses=[...(cls||[])].sort((a,b)=>classSortValue(a.name)-classSortValue(b.name)||String(a.name).localeCompare(String(b.name),"th"));
    const sortedStudents=[...(stu||[])].sort((a,b)=>classSortValue(a.classes?.name)-classSortValue(b.classes?.name)||Number(a.student_no||0)-Number(b.student_no||0)||String(a.full_name).localeCompare(String(b.full_name),"th"));
    setClasses(sortedClasses);setStudents(sortedStudents);setLoading(false);
  },[token]);
  useEffect(()=>{load();},[load]);
  if(loading)return <Spin/>;
  const fromStudents=students.filter(s=>String(s.class_id)===String(fromClass));
  const deleteList=students.filter(s=>{
    const q=query.trim().toLowerCase();
    if(manageClass&&String(s.class_id)!==String(manageClass))return false;
    if(!q)return true;
    return String(s.full_name||"").toLowerCase().includes(q)||String(s.classes?.name||"").toLowerCase().includes(q)||String(s.student_no||"").includes(q);
  }).slice(0,80);
  const toggle=id=>setSelected(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);
  async function moveStudents(){
    if(selected.length===0||!toClass)return alert("กรุณาเลือกนักเรียนและห้องปลายทาง");
    const target=classes.find(c=>String(c.id)===String(toClass));
    if(!confirm(`ยืนยันย้ายนักเรียน ${selected.length} คน ไป ${target?.name||"ห้องปลายทาง"} ?`))return;
    setBusy("move");
    try{
      await sbFetch("rpc/admin_move_students",{method:"POST",token,body:JSON.stringify({p_student_ids:selected.map(Number),p_class_id:Number(toClass)})});
      setSelected([]);await load();alert("ย้ายชั้นเรียบร้อย");
    }catch(e){alert(e.message);}
    finally{setBusy("");}
  }
  async function deleteStudent(s){
    const text=prompt(`ต้องการลบนักเรียนคนนี้ใช่ไหม?\n\n${s.full_name}\n${s.classes?.name||"-"} เลขที่ ${s.student_no||"-"}\n\nพิมพ์คำว่า ลบ เพื่อยืนยัน`);
    if(text!=="ลบ")return;
    setBusy(`delete-${s.id}`);
    try{
      await sbFetch("rpc/admin_delete_student",{method:"POST",token,body:JSON.stringify({p_student_id:Number(s.id)})});
      await load();alert("ลบนักเรียนเรียบร้อย");
    }catch(e){alert(e.message);}
    finally{setBusy("");}
  }
  function startEditStudent(s){
    setEditing({
      id:s.id,
      full_name:s.full_name||"",
      student_no:s.student_no||"",
      class_id:s.class_id?String(s.class_id):"",
      student_id_no:s.student_id_no||""
    });
  }
  async function saveStudentEdit(){
    if(!editing?.full_name.trim())return alert("กรุณากรอกชื่อ-สกุล");
    if(!editing.class_id)return alert("กรุณาเลือกห้องเรียน");
    setBusy(`edit-${editing.id}`);
    try{
      await sbFetch("rpc/admin_update_student",{method:"POST",token,body:JSON.stringify({
        p_student_id:Number(editing.id),
        p_full_name:editing.full_name.trim(),
        p_student_no:editing.student_no===""?null:Number(editing.student_no),
        p_class_id:Number(editing.class_id),
        p_student_id_no:String(editing.student_id_no||"").trim()
      })});
      setEditing(null);await load();alert("แก้ไขข้อมูลนักเรียนเรียบร้อย");
    }catch(e){alert(e.message);}
    finally{setBusy("");}
  }
  async function saveStudentPhoto(s,file){
    if(!file)return;
    if(!file.type.startsWith("image/"))return alert("กรุณาเลือกไฟล์รูปภาพ");
    if(photoDraft?.url)URL.revokeObjectURL(photoDraft.url);
    setPhotoDraft({student:s,file,url:URL.createObjectURL(file),zoom:1,x:0,y:0});
  }
  function closePhotoDraft(){
    if(photoDraft?.url)URL.revokeObjectURL(photoDraft.url);
    setPhotoDraft(null);
  }
  async function confirmStudentPhoto(){
    if(!photoDraft)return;
    const s=photoDraft.student;
    setBusy(`photo-${s.id}`);
    try{
      const croppedFile=await cropStudentPhotoFile(photoDraft.file,photoDraft);
      const readyFile=await compressImageFile(croppedFile);
      const ext=(readyFile.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,5)||"jpg";
      const path=`students/${s.id}-${Date.now()}.${ext}`;
      await uploadStudentPhoto(readyFile,path,token);
      await sbFetch("rpc/admin_set_student_photo",{method:"POST",token,body:JSON.stringify({p_student_id:Number(s.id),p_photo_path:path})});
      closePhotoDraft();await load();alert("อัปโหลดรูปนักเรียนเรียบร้อย");
    }catch(e){alert(e.message);}
    finally{setBusy("");}
  }
  const box={background:C.white,borderRadius:16,padding:16,boxShadow:"0 2px 8px rgba(0,0,0,0.07)"};
  const field={width:"100%",padding:"10px 12px",borderRadius:10,border:`1.5px solid ${C.g200}`,background:C.white,fontSize:14,color:C.navy,fontWeight:800,boxSizing:"border-box"};
  const classButtons=(value,onPick,exclude="")=><div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:7,marginTop:8}}>
    {classes.filter(c=>String(c.id)!==String(exclude)).map(c=><button key={c.id} type="button" onClick={()=>onPick(String(c.id))} style={{border:`1.5px solid ${String(value)===String(c.id)?C.navy:C.g200}`,background:String(value)===String(c.id)?C.navy:C.g50,color:String(value)===String(c.id)?C.white:C.navy,borderRadius:10,padding:"8px 4px",fontSize:12,fontWeight:900,cursor:"pointer"}}>{c.name}</button>)}
  </div>;
  return(
    <div style={{display:"flex",flexDirection:"column",gap:12}}>
      {photoDraft&&<div style={{position:"fixed",inset:0,zIndex:50,background:"rgba(15,23,42,0.55)",display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
        <div style={{background:C.white,borderRadius:18,padding:16,width:"100%",maxWidth:360,boxShadow:"0 20px 50px rgba(0,0,0,0.25)"}}>
          <div style={{fontSize:16,fontWeight:900,color:C.navy}}>ปรับรูปนักเรียน</div>
          <div style={{fontSize:12,color:C.g400,marginTop:2,marginBottom:12}}>เริ่มจากเห็นรูปครบ กดขยายถ้าต้องการให้หน้าใหญ่ขึ้น</div>
          <div style={{display:"flex",justifyContent:"center",marginBottom:12}}>
            <div style={{width:220,height:220,borderRadius:999,overflow:"hidden",border:`4px solid ${C.gold}`,background:C.g100,position:"relative"}}>
              <img src={photoDraft.url} alt="" style={{width:"100%",height:"100%",objectFit:"contain",transform:`translate(${photoDraft.x*110}px, ${photoDraft.y*110}px) scale(${photoDraft.zoom})`,transformOrigin:"center",transition:"transform 0.12s ease"}}/>
            </div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:8}}>
            <button onClick={()=>setPhotoDraft(p=>({...p,y:Math.max(-1,p.y-0.08)}))} style={{gridColumn:"2",border:"none",background:C.g100,color:C.navy,borderRadius:10,padding:10,fontWeight:900}}>ขึ้น</button>
            <button onClick={()=>setPhotoDraft(p=>({...p,x:Math.max(-1,p.x-0.08)}))} style={{border:"none",background:C.g100,color:C.navy,borderRadius:10,padding:10,fontWeight:900}}>ซ้าย</button>
            <button onClick={()=>setPhotoDraft(p=>({...p,x:0,y:0,zoom:1}))} style={{border:"none",background:C.goldP,color:C.yellow,borderRadius:10,padding:10,fontWeight:900}}>กลาง</button>
            <button onClick={()=>setPhotoDraft(p=>({...p,x:Math.min(1,p.x+0.08)}))} style={{border:"none",background:C.g100,color:C.navy,borderRadius:10,padding:10,fontWeight:900}}>ขวา</button>
            <button onClick={()=>setPhotoDraft(p=>({...p,y:Math.min(1,p.y+0.08)}))} style={{gridColumn:"2",border:"none",background:C.g100,color:C.navy,borderRadius:10,padding:10,fontWeight:900}}>ลง</button>
          </div>
          <div style={{display:"flex",gap:8,marginBottom:12}}>
            <button onClick={()=>setPhotoDraft(p=>({...p,zoom:Math.max(1,p.zoom-0.08)}))} style={{flex:1,border:"none",background:C.g100,color:C.navy,borderRadius:10,padding:10,fontWeight:900}}>ย่อ</button>
            <button onClick={()=>setPhotoDraft(p=>({...p,x:0,y:0,zoom:1}))} style={{flex:1,border:"none",background:C.goldP,color:C.yellow,borderRadius:10,padding:10,fontWeight:900}}>พอดี</button>
            <button onClick={()=>setPhotoDraft(p=>({...p,zoom:Math.min(2.4,p.zoom+0.08)}))} style={{flex:1,border:"none",background:C.g100,color:C.navy,borderRadius:10,padding:10,fontWeight:900}}>ขยาย</button>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={closePhotoDraft} disabled={busy===`photo-${photoDraft.student.id}`} style={{flex:1,border:"none",background:C.g200,color:C.navy,borderRadius:10,padding:11,fontWeight:900}}>ยกเลิก</button>
            <button onClick={confirmStudentPhoto} disabled={busy===`photo-${photoDraft.student.id}`} style={{flex:2,border:"none",background:busy===`photo-${photoDraft.student.id}`?C.g400:C.navy,color:C.white,borderRadius:10,padding:11,fontWeight:900}}>{busy===`photo-${photoDraft.student.id}`?"กำลังบันทึก...":"บันทึกรูป"}</button>
          </div>
        </div>
      </div>}
      <div style={box}>
        <div style={{fontSize:17,fontWeight:900,color:C.navy}}>🎓 จัดการนักเรียน</div>
        <div style={{fontSize:12,color:C.g400,marginTop:2}}>สำหรับย้ายชั้นปีการศึกษาใหม่ และจัดการรายชื่อนักเรียนในระบบ</div>
      </div>
      <div style={box}>
        <div style={{fontSize:15,fontWeight:900,color:C.navy,marginBottom:10}}>เลื่อนชั้น / ย้ายห้อง</div>
        <select value={fromClass} onChange={e=>{setFromClass(e.target.value);setSelected([]);}} style={field}>
          <option value="">เลือกห้องต้นทาง</option>
          {classes.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
        </select>
        {classButtons(fromClass,id=>{setFromClass(id);setSelected([]);})}
        <select value={toClass} onChange={e=>setToClass(e.target.value)} style={{...field,marginTop:8}}>
          <option value="">เลือกห้องปลายทาง</option>
          {classes.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
        </select>
        {classButtons(toClass,setToClass,fromClass)}
        {fromClass&&<div style={{marginTop:10,border:`1px solid ${C.g100}`,borderRadius:12,overflow:"hidden"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:10,background:C.g50}}>
            <span style={{fontSize:12,fontWeight:900,color:C.navy}}>เลือกแล้ว {selected.length}/{fromStudents.length} คน</span>
            <button onClick={()=>setSelected(selected.length===fromStudents.length?[]:fromStudents.map(s=>s.id))} style={{border:"none",background:"transparent",color:C.navy,fontSize:12,fontWeight:900,cursor:"pointer"}}>{selected.length===fromStudents.length?"ยกเลิกทั้งหมด":"เลือกทั้งห้อง"}</button>
          </div>
          <div style={{maxHeight:260,overflowY:"auto"}}>
            {fromStudents.map(s=><label key={s.id} style={{display:"flex",gap:9,alignItems:"center",padding:"9px 10px",borderTop:`1px solid ${C.g100}`,cursor:"pointer"}}>
              <input type="checkbox" checked={selected.includes(s.id)} onChange={()=>toggle(s.id)} style={{width:18,height:18,accentColor:C.navy}}/>
              <div style={{flex:1}}><div style={{fontSize:13,fontWeight:900,color:C.navy}}>{s.full_name}</div><div style={{fontSize:11,color:C.g400}}>เลขที่ {s.student_no||"-"}</div></div>
            </label>)}
          </div>
        </div>}
        <button onClick={moveStudents} disabled={busy==="move"||selected.length===0||!toClass} style={{width:"100%",marginTop:12,border:"none",background:busy==="move"||selected.length===0||!toClass?C.g400:C.navy,color:C.white,borderRadius:10,padding:12,fontWeight:900,cursor:"pointer"}}>{busy==="move"?"กำลังย้าย...":"ย้ายชั้น/ย้ายห้อง"}</button>
      </div>
      <div style={box}>
        <div style={{fontSize:15,fontWeight:900,color:C.red,marginBottom:4}}>ลบนักเรียนออกจากระบบ</div>
        <div style={{fontSize:12,color:C.g400,marginBottom:10}}>ใช้เฉพาะกรณีเพิ่มผิด หรือออกจากโรงเรียนจริงเท่านั้น</div>
        <select value={manageClass} onChange={e=>setManageClass(e.target.value)} style={{...field,marginBottom:8}}>
          <option value="">ทุกห้อง</option>
          {classes.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
        </select>
        <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="ค้นหาชื่อ ห้อง หรือเลขที่" style={{...field,fontWeight:700,color:C.g700}}/>
        {editing&&<div style={{marginTop:10,background:C.g50,border:`1px solid ${C.g200}`,borderRadius:12,padding:12}}>
          <div style={{fontSize:14,fontWeight:900,color:C.navy,marginBottom:8}}>แก้ไขข้อมูลนักเรียน</div>
          <input value={editing.full_name} onChange={e=>setEditing(p=>({...p,full_name:e.target.value}))} placeholder="ชื่อ-สกุล" style={{...field,fontWeight:700,color:C.g700,marginBottom:8}}/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
            <input value={editing.student_no} onChange={e=>setEditing(p=>({...p,student_no:e.target.value.replace(/[^\d]/g,"")}))} placeholder="เลขที่" inputMode="numeric" style={{...field,fontWeight:700,color:C.g700}}/>
            <input value={editing.student_id_no} onChange={e=>setEditing(p=>({...p,student_id_no:e.target.value.replace(/\D/g,"").slice(0,13)}))} placeholder="เลขประจำตัว 13 หลัก" inputMode="numeric" maxLength="13" style={{...field,fontWeight:700,color:C.g700}}/>
          </div>
          <select value={editing.class_id} onChange={e=>setEditing(p=>({...p,class_id:e.target.value}))} style={{...field,marginTop:8}}>
            <option value="">เลือกห้องเรียน</option>
            {classes.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
          </select>
          {classButtons(editing.class_id,id=>setEditing(p=>({...p,class_id:id})))}
          <div style={{display:"flex",gap:8,marginTop:10}}>
            <button onClick={saveStudentEdit} disabled={busy===`edit-${editing.id}`} style={{flex:1,border:"none",background:C.navy,color:C.white,borderRadius:10,padding:10,fontWeight:900,cursor:"pointer"}}>{busy===`edit-${editing.id}`?"กำลังบันทึก...":"บันทึกข้อมูล"}</button>
            <button onClick={()=>setEditing(null)} style={{border:"none",background:C.g200,color:C.navy,borderRadius:10,padding:"10px 14px",fontWeight:900,cursor:"pointer"}}>ยกเลิก</button>
          </div>
        </div>}
        <div style={{marginTop:10,maxHeight:360,overflowY:"auto"}}>
          {deleteList.map(s=><div key={s.id} style={{display:"flex",justifyContent:"space-between",gap:8,alignItems:"center",padding:"9px 0",borderBottom:`1px solid ${C.g100}`}}>
            <StudentAvatar path={s.photo_path} token={token} size={38}/>
            <div style={{flex:1,minWidth:0}}><div style={{fontSize:13,fontWeight:900,color:C.navy,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{s.full_name}</div><div style={{fontSize:11,color:C.g400}}>{s.classes?.name||"-"} · เลขที่ {s.student_no||"-"}</div></div>
            <div style={{display:"flex",gap:6}}>
              <label style={{border:"none",background:C.goldP,color:C.yellow,borderRadius:9,padding:"7px 9px",fontSize:12,fontWeight:900,cursor:"pointer",whiteSpace:"nowrap"}}>
                {busy===`photo-${s.id}`?"...":"รูป"}
                <input type="file" accept="image/*" disabled={busy===`photo-${s.id}`} onChange={e=>saveStudentPhoto(s,e.target.files?.[0])} style={{display:"none"}}/>
              </label>
              <button onClick={()=>startEditStudent(s)} style={{border:"none",background:C.g100,color:C.navy,borderRadius:9,padding:"7px 9px",fontSize:12,fontWeight:900,cursor:"pointer"}}>แก้ไข</button>
              <button onClick={()=>deleteStudent(s)} disabled={busy===`delete-${s.id}`} style={{border:"none",background:C.redL,color:C.red,borderRadius:9,padding:"7px 10px",fontSize:12,fontWeight:900,cursor:"pointer"}}>{busy===`delete-${s.id}`?"...":"ลบ"}</button>
            </div>
          </div>)}
        </div>
      </div>
    </div>
  );
}

// ======= TUITION PHASE 1 =======
function TuitionView({token,profile,student}){
  const isStaff=["finance","admin"].includes(profile?.role);
  const isTeacher=!student&&["teacher","teacher_parent"].includes(profile?.role);
  const [studentInfo,setStudentInfo]=useState(student||null);
  const [teacherClasses,setTeacherClasses]=useState([]);
  const [invoices,setInvoices]=useState([]);
  const [staffInvoices,setStaffInvoices]=useState([]);
  const [payments,setPayments]=useState([]);
  const [paymentHistory,setPaymentHistory]=useState([]);
  const [showHistory,setShowHistory]=useState(false);
  const [historyStatus,setHistoryStatus]=useState("all");
  const [staffSection,setStaffSection]=useState("manage");
  const [invoiceClass,setInvoiceClass]=useState("all");
  const [historyClass,setHistoryClass]=useState("all");
  const [receipts,setReceipts]=useState([]);
  const [terms,setTerms]=useState([]);
  const [classes,setClasses]=useState([]);
  const [invoiceStudents,setInvoiceStudents]=useState([]);
  const [selectedStudentIds,setSelectedStudentIds]=useState([]);
  const [invoiceStudentSearch,setInvoiceStudentSearch]=useState("");
  const [invoiceStudentsLoading,setInvoiceStudentsLoading]=useState(false);
  const [invoiceStudentsError,setInvoiceStudentsError]=useState("");
  const [invoiceStudentReload,setInvoiceStudentReload]=useState(0);
  const [loading,setLoading]=useState(true);
  const [busy,setBusy]=useState("");
  const [form,setForm]=useState({invoiceId:"",amount:"",file:null});
  const [createForm,setCreateForm]=useState({termId:"",classId:"",description:"ค่าเล่าเรียน",amount:"",dueDate:""});
  const [addItemForm,setAddItemForm]=useState(null);
  const [addItemMessage,setAddItemMessage]=useState("");
  const [cashForm,setCashForm]=useState(null);
  const [cashMessage,setCashMessage]=useState("");
  const [itemBalances,setItemBalances]=useState([]);
  const [allocationForm,setAllocationForm]=useState(null);
  const [allocationMessage,setAllocationMessage]=useState("");
  const [error,setError]=useState("");
  const money=n=>Number(n||0).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2});
  const statusMap={
    draft:["ฉบับร่าง",C.g600,C.g100],unpaid:["ค้างชำระ",C.red,C.redL],
    pending:["รอตรวจสอบ",C.yellow,C.yellowL],paid:["ชำระแล้ว",C.green,C.greenL],
    cancelled:["ยกเลิก",C.g600,C.g100],approved:["อนุมัติแล้ว",C.green,C.greenL],
    rejected:["ไม่ผ่าน",C.red,C.redL],partial:["ชำระบางส่วน",C.yellow,C.yellowL]
  };
  const invoiceStatus=inv=>inv.status==="unpaid"&&Number(inv.paid_amount)>0?"partial":inv.status;
  const invoiceBalance=inv=><div style={{fontSize:12,lineHeight:1.7,color:C.g600,marginTop:8}}>ชำระแล้ว (ตรวจสอบแล้ว) ฿{money(inv.paid_amount)}<br/>คงเหลือ ฿{money(Math.max(0,Number(inv.total_amount)-Number(inv.paid_amount)))}</div>;
  async function loadItemBalances(rows){
    const ids=(rows||[]).map(i=>i.id);
    setItemBalances(ids.length?await sbFetch("rpc/get_fee_item_balances",{method:"POST",token,body:JSON.stringify({p_invoice_ids:ids})}):[]);
  }

  const load=useCallback(async()=>{
    setLoading(true);setError("");
    try{
      if(isStaff){
        const [allPay,t,c,allInv]=await Promise.all([
          sbFetch("payments?select=*,student_invoices(invoice_no,total_amount,student_id,students(full_name,student_no,classes(name))),receipts(receipt_no,issued_at),cash_tuition_payments(recorded_by_name,recorded_at),tuition_payment_item_allocations(item_id,amount)&order=created_at.desc&limit=300",{token}),
          sbFetch("fee_terms?is_active=eq.true&select=*&order=academic_year.desc,term_no.desc",{token}),
          sbFetch("classes?select=id,name&order=id.asc",{token}),
          sbFetch("student_invoices?select=*,fee_terms(name,academic_year,term_no),students(full_name,student_no,classes(name)),invoice_items(id,description,amount)&order=created_at.desc&limit=300",{token})
        ]);
        setPaymentHistory(allPay||[]);
        setPayments((allPay||[]).filter(x=>x.status==="pending").reverse());
        setTerms(t||[]);setClasses(c||[]);
        setStaffInvoices(allInv||[]);
        await loadItemBalances(allInv);
      }else if(isTeacher){
        const links=await sbFetch(`teacher_class?teacher_id=eq.${profile.id}&select=class_id,classes(id,name)`,{token});
        const classIds=(links||[]).map(x=>x.class_id);
        setTeacherClasses((links||[]).map(x=>x.classes).filter(Boolean));
        if(!classIds.length){setInvoices([]);setPayments([]);setError("ยังไม่ได้ผูกครูประจำชั้นกับห้องเรียน");return;}
        const students=await sbFetch(`students?class_id=in.(${classIds.join(",")})&select=id&order=student_no.asc`,{token});
        const studentIds=(students||[]).map(x=>x.id);
        if(!studentIds.length){setInvoices([]);setPayments([]);return;}
        const inv=await sbFetch(`student_invoices?student_id=in.(${studentIds.join(",")})&select=*,fee_terms(name,academic_year,term_no),students(full_name,student_no,classes(name)),invoice_items(id,description,amount)&order=created_at.desc`,{token});
        setInvoices(inv||[]);
        await loadItemBalances(inv);
        const invoiceIds=(inv||[]).map(x=>x.id);
        const classPayments=invoiceIds.length?await sbFetch(`payments?invoice_id=in.(${invoiceIds.join(",")})&select=*,receipts(receipt_no,issued_at),cash_tuition_payments(recorded_by_name,recorded_at),tuition_payment_item_allocations(item_id,amount)&order=created_at.desc`,{token}):[];
        setPayments(classPayments||[]);
      }else{
        let s=studentInfo;
        if(!s){
          const found=await sbFetch(`students?profile_id=eq.${profile.id}&select=id,full_name,student_no,classes(name)&limit=1`,{token});
          s=found?.[0]||null;setStudentInfo(s);
        }
        if(!s){setInvoices([]);return;}
        const inv=await sbFetch(`student_invoices?student_id=eq.${s.id}&select=*,fee_terms(name,academic_year,term_no),invoice_items(id,description,amount)&order=created_at.desc`,{token});
        setInvoices(inv||[]);
        await loadItemBalances(inv);
        const ids=(inv||[]).map(x=>x.id);
        if(ids.length){
          const pay=await sbFetch(`payments?invoice_id=in.(${ids.join(",")})&select=*,cash_tuition_payments(recorded_by_name,recorded_at),tuition_payment_item_allocations(item_id,amount)&order=created_at.desc`,{token});
          setPayments(pay||[]);
          const payIds=(pay||[]).map(x=>x.id);
          if(payIds.length){
            const rec=await sbFetch(`receipts?payment_id=in.(${payIds.join(",")})&select=*`,{token});
            setReceipts(rec||[]);
          }else setReceipts([]);
        }else{setPayments([]);setReceipts([]);}
      }
    }catch(e){setError(e.message||"โหลดข้อมูลค่าเทอมไม่สำเร็จ");}
    finally{setLoading(false);}
  },[token,profile.id,isStaff,isTeacher,studentInfo?.id]);
  useEffect(()=>{load();},[load]);
  useEffect(()=>{
    let active=true;
    setInvoiceStudents([]);setSelectedStudentIds([]);setInvoiceStudentSearch("");setInvoiceStudentsError("");
    if(!isStaff||!createForm.classId){
      setInvoiceStudentsLoading(false);
      return;
    }
    setInvoiceStudentsLoading(true);
    sbFetch(`students?class_id=eq.${createForm.classId}&select=id,full_name,student_no&order=student_no.asc,full_name.asc`,{token})
      .then(r=>{if(active)setInvoiceStudents(r||[]);})
      .catch(e=>{if(active)setInvoiceStudentsError(e.message||"โหลดรายชื่อนักเรียนไม่สำเร็จ");})
      .finally(()=>{if(active)setInvoiceStudentsLoading(false);});
    return ()=>{active=false;};
  },[token,isStaff,createForm.classId,invoiceStudentReload]);

  async function submitPayment(){
    const invoice=invoices.find(x=>x.id===form.invoiceId);
    if(!invoice||!form.file||Number(form.amount)<=0){setError("กรุณาเลือกใบแจ้งยอด ระบุจำนวนเงิน และแนบสลิป");return;}
    if(!form.file.type.startsWith("image/")){setError("กรุณาแนบสลิปเป็นไฟล์รูปภาพ");return;}
    if(form.file.size>5*1024*1024){setError("ไฟล์สลิปต้องมีขนาดไม่เกิน 5 MB");return;}
    setBusy("submit");setError("");
    try{
      const ext=(form.file.name.split(".").pop()||"jpg").replace(/[^a-zA-Z0-9]/g,"").toLowerCase();
      const path=`${profile.id}/${invoice.id}/${Date.now()}.${ext}`;
      await uploadPaymentSlip(form.file,path,token);
      const created=await sbFetch("payments",{method:"POST",token,body:JSON.stringify({
        invoice_id:invoice.id,parent_id:profile.id,amount:Number(form.amount),
        method:"bank_transfer",paid_at:new Date().toISOString(),slip_path:path,status:"pending"
      })});
      const payment=created?.[0];
      if(payment){
        try{
          await notifyTelegramPayment(payment.id,token);
        }catch(e){
          setError(`ส่งสลิปแล้ว แต่แจ้ง Telegram ไม่สำเร็จ: ${e.message}`);
        }
      }
      setForm({invoiceId:"",amount:"",file:null});await load();
    }catch(e){setError(e.message);}
    finally{setBusy("");}
  }

  async function openSlip(path){
    try{const url=await getPaymentSlipUrl(path,token);window.open(url,"_blank");}
    catch(e){setError(e.message);}
  }
  async function review(payment,status){
    const note=status==="rejected"?prompt("ระบุเหตุผลที่ไม่อนุมัติ เพื่อแจ้งผู้ปกครอง"):"";
    if(status==="rejected"&&(note===null||!note.trim()))return;
    if(status==="approved"&&!window.confirm(`ยืนยันตรวจรับยอด ${money(payment.amount)} บาท จากหลักฐานรายการนี้?`))return;
    setBusy(payment.id);setError("");
    try{
      await sbFetch("rpc/review_fee_payment",{method:"POST",token,body:JSON.stringify({
        p_payment_id:payment.id,p_decision:status,p_note:note
      })});
      await load();
    }catch(e){setError(e.message);}
    finally{setBusy("");}
  }
  async function createInvoices(){
    if(invoiceStudentsLoading||invoiceStudentsError||selectedStudentIds.some(id=>!invoiceStudents.some(s=>String(s.id)===id))){
      setError("กรุณารอรายชื่อนักเรียนโหลดสำเร็จ แล้วเลือกผู้รับใบแจ้งยอดอีกครั้ง");return;
    }
    if(!createForm.termId||!createForm.classId||selectedStudentIds.length===0||!createForm.description.trim()||Number(createForm.amount)<=0||!createForm.dueDate){
      setError("กรุณากรอกข้อมูลใบแจ้งยอดให้ครบ");return;
    }
    if(!window.confirm(`สร้างใบแจ้งยอดเฉพาะนักเรียนที่เลือก ${selectedStudentIds.length} คน คนละ ${money(createForm.amount)} บาท รวม ${money(Number(createForm.amount)*selectedStudentIds.length)} บาท ใช่หรือไม่?`))return;
    setBusy("create");setError("");
    try{
      const result=await sbFetch("rpc/create_fee_invoices_for_students",{method:"POST",token,body:JSON.stringify({
        p_term_id:Number(createForm.termId),
        p_description:createForm.description.trim(),
        p_amount:Number(createForm.amount),
        p_due_date:createForm.dueDate,
        p_student_ids:selectedStudentIds.map(Number)
      })});
      const createdCount=Number(result||0);
      alert(`สร้างใบแจ้งยอดใหม่ ${createdCount} รายการ${createdCount<selectedStudentIds.length?` · ข้าม ${selectedStudentIds.length-createdCount} คนที่มีใบแจ้งยอดในภาคเรียนนี้แล้ว`:""}`);
      setCreateForm(p=>({...p,description:"ค่าเล่าเรียน",amount:""}));
      setSelectedStudentIds([]);
      await load();
    }catch(e){setError(e.message);}
    finally{setBusy("");}
  }

  async function addInvoiceItem(){
    if(!isStaff||!addItemForm||busy)return;
    const amount=Number(addItemForm.amount);
    const invoice=staffInvoices.find(x=>x.id===addItemForm.invoiceId);
    if(!invoice||!addItemForm.description.trim()||!Number.isFinite(amount)||amount<=0||!/^\d+(\.\d{1,2})?$/.test(addItemForm.amount.trim())){
      setError("กรุณาระบุชื่อรายการและจำนวนเงินมากกว่า 0 ไม่เกิน 2 ตำแหน่งทศนิยม");return;
    }
    if(!window.confirm(`เพิ่ม ${addItemForm.description.trim()} จำนวน ${money(amount)} บาท ให้ ${invoice.students?.full_name||invoice.invoice_no}\nยอดรวมใหม่ ${money(Number(invoice.total_amount)+amount)} บาท\nยอดคงเหลือใหม่ ${money(Math.max(0,Number(invoice.total_amount)+amount-Number(invoice.paid_amount)))} บาท\nยืนยันเพิ่มรายการหรือไม่?`))return;
    setBusy("add-item");setError("");setAddItemMessage("");
    try{
      const result=await sbFetch("rpc/add_fee_invoice_item",{method:"POST",token,body:JSON.stringify({
        p_invoice_id:addItemForm.invoiceId,p_description:addItemForm.description.trim(),p_amount:amount,
        p_request_id:addItemForm.requestId,p_reason:addItemForm.reason.trim()
      })});
      setAddItemForm(null);setAddItemMessage(`เพิ่มรายการแล้ว · ยอดรวม ฿${money(result.new_total)} · คงเหลือ ฿${money(result.remaining_amount)}`);
      await load();
    }catch(e){setError(e.message);}
    finally{setBusy("");}
  }
  async function recordCash(){
    if(!cashForm||busy)return;
    const amount=Number(cashForm.amount);
    if(!Number.isFinite(amount)||amount<=0||!/^\d+(\.\d{1,2})?$/.test(cashForm.amount.trim())||!cashForm.receipt.trim()||!cashForm.paidAt){setError("กรุณากรอกยอดเงิน วันที่รับเงินจริง และเลขใบเสร็จให้ครบ");return;}
    const invoice=[...staffInvoices,...invoices].find(i=>i.id===cashForm.invoiceId);
    if(!invoice)return;
    if(!window.confirm(`ยืนยันรับชำระเงินสด ${money(amount)} บาท\nนักเรียน ${invoice.students?.full_name||invoice.invoice_no}\nเลขใบเสร็จ ${cashForm.receipt.trim()}\nยอดนี้จะได้รับการอนุมัติโดยบัญชีของคุณทันที ยืนยันหรือไม่?`))return;
    setBusy("cash");setError("");setCashMessage("");setAddItemMessage("");
    try{
      const result=await sbFetch("rpc/record_cash_tuition_payment",{method:"POST",token,body:JSON.stringify({p_invoice_id:cashForm.invoiceId,p_amount:amount,p_paid_at:cashForm.paidAt+":00+07:00",p_receipt_number:cashForm.receipt.trim(),p_request_id:cashForm.requestId,p_note:cashForm.note.trim()})});
      setCashForm(null);setCashMessage(`บันทึกเงินสดแล้ว · ใบเสร็จ ${cashForm.receipt.trim()} · คงเหลือ ฿${money(result.remaining_amount)}`);await load();
    }catch(e){setError(e.message);}
    finally{setBusy("");}
  }
  async function savePaymentAllocation(){
    if(!allocationForm||busy)return;
    const payment=[...paymentHistory,...payments].find(p=>p.id===allocationForm.paymentId);
    if(!payment)return;
    const rows=Object.entries(allocationForm.amounts).filter(([,amount])=>Number(amount)>0).map(([id,amount])=>({item_id:Number(id),amount:Number(amount)}));
    const totalCents=rows.reduce((sum,row)=>sum+Math.round(row.amount*100),0);
    if(!rows.length||Object.values(allocationForm.amounts).some(a=>a&&!/^\d+(\.\d{1,2})?$/.test(a))||totalCents!==Math.round(Number(payment.amount)*100)){
      setError(`ยอดที่แยกต้องเท่ากับยอดชำระครั้งนี้ ฿${money(payment.amount)}`);return;
    }
    if(!window.confirm(`ยืนยันแยกยอดชำระเดิม ฿${money(payment.amount)} ตามรายการที่เลือก?\nไม่มีการรับเงินหรือหักยอดรวมซ้ำ`))return;
    setBusy("allocate");setError("");setAllocationMessage("");
    try{
      await sbFetch("rpc/allocate_fee_payment",{method:"POST",token,body:JSON.stringify({p_payment_id:payment.id,p_allocations:rows,p_request_id:allocationForm.requestId})});
      setAllocationForm(null);setAllocationMessage("ระบุรายการที่ชำระแล้ว ยอดชำระรวมและยอดคงเหลือรวมไม่เปลี่ยน");await load();
    }catch(e){setError(e.message);}
    finally{setBusy("");}
  }
  if(loading)return <Spin/>;
  const box={background:C.white,borderRadius:16,padding:16,boxShadow:"0 2px 8px rgba(0,0,0,0.07)"};
  const cashInfo=p=>{
    if(p.method!=="cash")return null;
    const info=Array.isArray(p.cash_tuition_payments)?p.cash_tuition_payments[0]:p.cash_tuition_payments;
    return <div style={{fontSize:12,lineHeight:1.7,color:C.navy,marginTop:6}}>💵 เงินสด · รับเงินจริง {formatThaiDateTime(p.paid_at)}{info&&<><br/>ผู้บันทึก/อนุมัติ: {info.recorded_by_name}<br/>บันทึกเข้าระบบ: {formatThaiDateTime(info.recorded_at)}</>}</div>;
  };
  const cashControls=inv=>{
    if(["paid","cancelled","draft"].includes(inv.status))return null;
    const pending=payments.some(p=>p.invoice_id===inv.id&&p.status==="pending");
    if(cashForm?.invoiceId!==inv.id)return <div style={{marginTop:10}}><button disabled={!!busy||pending} onClick={()=>{setError("");setCashMessage("");setCashForm({invoiceId:inv.id,amount:"",receipt:"",paidAt:new Date(Date.now()+7*3600000).toISOString().slice(0,16),note:"",requestId:crypto.randomUUID()});}} style={{padding:"8px 10px",border:`1px solid ${C.green}`,borderRadius:8,background:C.white,color:C.green,fontWeight:800}}>💵 รับชำระเงินสด</button>{pending&&<div style={{fontSize:12,color:C.yellow,marginTop:5}}>มีสลิปรอตรวจ กรุณาตรวจให้เสร็จก่อนบันทึกเงินสด</div>}</div>;
    const change=(key,value)=>setCashForm(p=>({...p,[key]:value,requestId:crypto.randomUUID()}));
    const inputStyle={width:"100%",padding:10,border:`1px solid ${C.g200}`,borderRadius:8,marginTop:4};
    return <div style={{display:"grid",gap:8,marginTop:12,paddingTop:12,borderTop:`1px solid ${C.g200}`}}>
      <div style={{fontSize:14,fontWeight:800,color:C.navy}}>รับชำระเงินสด · คงเหลือ ฿{money(Math.max(0,Number(inv.total_amount)-Number(inv.paid_amount)))}</div>
      <label style={{fontSize:12}}>จำนวนเงินสด (บาท)<input aria-label="จำนวนเงินสด" type="number" min="0.01" step="0.01" disabled={!!busy} value={cashForm.amount} onChange={e=>change("amount",e.target.value)} style={inputStyle}/></label>
      <label style={{fontSize:12}}>วันที่และเวลารับเงินจริง (เวลาไทย)<input aria-label="เวลารับเงินสด" type="datetime-local" disabled={!!busy} value={cashForm.paidAt} onChange={e=>change("paidAt",e.target.value)} style={{...inputStyle,minWidth:0}}/></label>
      <label style={{fontSize:12}}>เลขใบเสร็จที่ออกแล้ว<input aria-label="เลขใบเสร็จเงินสด" maxLength={100} disabled={!!busy} value={cashForm.receipt} onChange={e=>change("receipt",e.target.value)} style={inputStyle}/></label>
      <label style={{fontSize:12}}>หมายเหตุ (ถ้ามี)<textarea aria-label="หมายเหตุเงินสด" maxLength={1000} disabled={!!busy} value={cashForm.note} onChange={e=>change("note",e.target.value)} style={{...inputStyle,resize:"vertical"}}/></label>
      <div style={{fontSize:12,color:C.navy}}>ผู้บันทึก/อนุมัติ: {profile.full_name}<br/>คงเหลือหลังรับเงิน ฿{money(Math.max(0,Number(inv.total_amount)-Number(inv.paid_amount)-Math.max(0,Number(cashForm.amount)||0)))}</div>
      <div style={{display:"flex",gap:8}}><button disabled={!!busy} onClick={recordCash} style={{flex:1,padding:10,border:0,borderRadius:8,background:C.green,color:C.white,fontWeight:800}}>{busy==="cash"?"กำลังบันทึก...":"ยืนยันรับเงินสด"}</button><button disabled={!!busy} onClick={()=>setCashForm(null)} style={{padding:10,border:`1px solid ${C.g200}`,borderRadius:8,background:C.white}}>ยกเลิก</button></div>
    </div>;
  };
  const invoiceItems=inv=>{
    const rows=itemBalances.filter(i=>i.invoice_id===inv.id);
    const outstanding=rows.filter(i=>Number(i.remaining_amount)>0);
    const completed=rows.filter(i=>Number(i.remaining_amount)<=0);
    const unassigned=Math.max(0,Number(inv.paid_amount)-rows.reduce((n,i)=>n+Number(i.paid_amount),0));
    const itemRow=item=><div key={item.item_id} style={{fontSize:12,padding:"6px 0",borderBottom:`1px solid ${C.g100}`}}>
      <div style={{display:"flex",justifyContent:"space-between",gap:12}}><b style={{overflowWrap:"anywhere"}}>{item.description}</b><span style={{whiteSpace:"nowrap"}}>฿{money(item.amount)}</span></div>
      <div style={{color:C.green,marginTop:3}}>ระบุชำระแล้ว ฿{money(item.paid_amount)}</div><div style={{color:C.g600}}>คงเหลือตามการระบุ ฿{money(item.remaining_amount)}</div>
    </div>;
    return <div style={{marginTop:8}}>
      <div aria-label="รายการค้างชำระ">{outstanding.map(itemRow)}</div>
      {completed.length>0&&<details aria-label="รายการที่ชำระครบแล้ว" style={{marginTop:8,fontSize:12}}>
        <summary style={{cursor:"pointer",color:C.green,padding:"8px 0",fontWeight:700}}>รายการที่ชำระครบแล้ว ({completed.length})</summary>
        {completed.map(itemRow)}
      </details>}
      {unassigned>0&&<div style={{fontSize:12,color:C.yellow,lineHeight:1.7,marginTop:6}}>ยอดชำระรอระบุรายการ ฿{money(unassigned)}<br/>รวมอยู่ในยอดชำระแล้ว แต่ยังไม่แยกลงรายการด้านบน</div>}
    </div>;
  };
  const paymentAllocationInfo=p=>{
    const rows=p.tuition_payment_item_allocations||[];
    return rows.length>0?<div style={{fontSize:12,color:C.green,lineHeight:1.7,marginTop:6}}>{rows.map(a=><div key={a.item_id}>{itemBalances.find(i=>String(i.item_id)===String(a.item_id))?.description||"รายการ"} · ฿{money(a.amount)}</div>)}</div>:null;
  };
  const allocationControls=p=>{
    if(p.status!=="approved"||(p.tuition_payment_item_allocations||[]).length)return null;
    const rows=itemBalances.filter(i=>i.invoice_id===p.invoice_id&&Number(i.remaining_amount)>0);
    if(allocationForm?.paymentId!==p.id)return <button disabled={!!busy||!rows.length} onClick={()=>{setError("");setAllocationMessage("");setAllocationForm({paymentId:p.id,amounts:{},requestId:crypto.randomUUID()});}} style={{marginTop:8,padding:"8px 10px",border:`1px solid ${C.navy}`,borderRadius:8,background:C.white,color:C.navy,fontWeight:700}}>ระบุรายการที่ชำระ</button>;
    const selectedTotal=Object.values(allocationForm.amounts).reduce((sum,a)=>sum+Math.round(Number(a||0)*100),0)/100;
    return <div style={{display:"grid",gap:8,marginTop:10,paddingTop:10,borderTop:`1px solid ${C.g200}`}}>
      <b style={{fontSize:13}}>แยกยอดที่รับแล้ว ฿{money(p.amount)}</b>
      {rows.map(item=><label key={item.item_id} style={{fontSize:12,color:C.navy}}>{item.description} · ระบุได้อีก ฿{money(item.remaining_amount)}<input aria-label={`จัดสรร ${item.description}`} type="number" min="0" max={item.remaining_amount} step="0.01" placeholder="0.00" disabled={!!busy} value={allocationForm.amounts[item.item_id]||""} onChange={e=>setAllocationForm(f=>({...f,amounts:{...f.amounts,[item.item_id]:e.target.value},requestId:crypto.randomUUID()}))} style={{width:"100%",padding:10,marginTop:4,border:`1px solid ${C.g200}`,borderRadius:8}}/></label>)}
      <div style={{fontSize:12,color:Math.round(selectedTotal*100)===Math.round(Number(p.amount)*100)?C.green:C.red}}>ระบุแล้ว ฿{money(selectedTotal)} / ฿{money(p.amount)}</div>
      <div style={{display:"flex",gap:8}}><button disabled={!!busy} onClick={savePaymentAllocation} style={{flex:1,padding:10,border:0,borderRadius:8,background:C.navy,color:C.white,fontWeight:800}}>บันทึกการแยกรายการ</button><button disabled={!!busy} onClick={()=>setAllocationForm(null)} style={{padding:10,border:`1px solid ${C.g200}`,borderRadius:8,background:C.white}}>ยกเลิก</button></div>
    </div>;
  };
  const badge=status=>{const x=statusMap[status]||[status,C.g600,C.g100];return <span style={{background:x[2],color:x[1],borderRadius:99,padding:"3px 9px",fontSize:11,fontWeight:800}}>{x[0]}</span>;};
  const reviewPayments=inv=>(isStaff?paymentHistory:payments).filter(p=>p.invoice_id===inv.id).map(p=><div key={p.id} style={{marginTop:10,paddingTop:10,borderTop:`1px solid ${C.g200}`}}>
    <div style={{display:"flex",justifyContent:"space-between",gap:8,fontSize:13}}><b>แจ้งชำระ ฿{money(p.amount)}</b>{badge(p.status)}</div>
    {cashInfo(p)}
    {paymentAllocationInfo(p)}
    {allocationControls(p)}
    {(Array.isArray(p.receipts)?p.receipts[0]:p.receipts)?.receipt_no&&<div style={{fontSize:12,color:C.green,marginTop:5}}>ใบเสร็จ {(Array.isArray(p.receipts)?p.receipts[0]:p.receipts).receipt_no}</div>}
    {p.reviewed_at&&<div style={{fontSize:11,color:C.g600,marginTop:5}}>ตรวจเมื่อ {formatThaiDateTime(p.reviewed_at)}</div>}
    {p.review_note&&<div style={{fontSize:12,color:C.red,marginTop:5}}>เหตุผล: {p.review_note}</div>}
    <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:8}}>
      {p.slip_path&&<button onClick={()=>openSlip(p.slip_path)} style={{padding:9,border:`1px solid ${C.navy}`,borderRadius:8,background:C.white,color:C.navy,fontWeight:700}}>ดูสลิป</button>}
      {p.status==="pending"&&<><button disabled={!!busy} onClick={()=>review(p,"rejected")} style={{padding:9,border:0,borderRadius:8,background:C.redL,color:C.red,fontWeight:700}}>ไม่อนุมัติ</button><button disabled={!!busy} onClick={()=>review(p,"approved")} style={{padding:9,border:0,borderRadius:8,background:C.greenL,color:C.green,fontWeight:700}}>อนุมัติ</button></>}
    </div>
  </div>);
  const filteredStaffInvoices=staffInvoices.filter(x=>invoiceClass==="all"||String(x.students?.classes?.name)===invoiceClass);
  const visibleInvoiceStudents=invoiceStudents.filter(s=>`${s.full_name} ${s.student_no||""}`.toLowerCase().includes(invoiceStudentSearch.trim().toLowerCase()));
  const filteredPaymentHistory=paymentHistory.filter(p=>
    (historyStatus==="all"||p.status===historyStatus)&&
    (historyClass==="all"||String(p.student_invoices?.students?.classes?.name)===historyClass)
  );

  if(isStaff)return(
    <div style={{display:"flex",flexDirection:"column",gap:12}}>
      <div style={box}>
        <div style={{fontSize:16,fontWeight:800,color:C.navy}}>💰 ตรวจสอบการชำระค่าเทอม</div>
        <div style={{fontSize:12,color:C.g400,marginTop:3}}>รายการรอตรวจสอบ {payments.length} รายการ</div>
      </div>
      {error&&<div style={{background:C.redL,color:C.red,borderRadius:10,padding:12,fontSize:13,fontWeight:700}}>{error}</div>}
      {addItemMessage&&<div role="status" style={{background:C.greenL,color:C.green,borderRadius:8,padding:12,fontSize:13,fontWeight:700}}>{addItemMessage}</div>}
      {cashMessage&&<div role="status" style={{background:C.greenL,color:C.green,padding:12,borderRadius:8,fontSize:13,fontWeight:700}}>{cashMessage}</div>}
      {allocationMessage&&<div role="status" style={{background:C.greenL,color:C.green,padding:12,borderRadius:8,fontSize:13,fontWeight:700}}>{allocationMessage}</div>}
      <div style={{background:C.white,borderRadius:12,padding:5,display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:5,boxShadow:"0 2px 8px rgba(0,0,0,0.07)"}}>
        {[{id:"manage",label:"จัดการ"},{id:"invoices",label:"ใบแจ้งยอด"},{id:"history",label:"ประวัติ"}].map(x=><button key={x.id} onClick={()=>setStaffSection(x.id)} style={{border:"none",borderRadius:9,padding:"9px 4px",background:staffSection===x.id?C.navy:C.g100,color:staffSection===x.id?C.white:C.g600,fontWeight:800,fontSize:12,cursor:"pointer"}}>{x.label}</button>)}
      </div>
      {staffSection==="manage"&&<div style={box}>
        <div style={{fontSize:14,fontWeight:800,color:C.navy,marginBottom:10}}>สร้างใบแจ้งยอดเฉพาะคน</div>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          <select value={createForm.termId} onChange={e=>setCreateForm(p=>({...p,termId:e.target.value}))} style={{padding:10,borderRadius:10,border:`1.5px solid ${C.g200}`,fontSize:14}}>
            <option value="">เลือกปีการศึกษา/ภาคเรียน</option>
            {terms.map(t=><option key={t.id} value={t.id}>{t.name} ({t.academic_year})</option>)}
          </select>
          <select value={createForm.classId} onChange={e=>{setInvoiceStudents([]);setSelectedStudentIds([]);setInvoiceStudentsLoading(!!e.target.value);setCreateForm(p=>({...p,classId:e.target.value}));}} style={{padding:10,borderRadius:10,border:`1.5px solid ${C.g200}`,fontSize:14}}>
            <option value="">เลือกห้องเรียน</option>
            {classes.map(c=><option key={c.id} value={c.id}>{c.name}{classes.filter(x=>x.name===c.name).length>1?` (รหัสห้อง ${c.id})`:""}</option>)}
          </select>
          {createForm.classId&&<div style={{border:`1.5px solid ${C.g200}`,borderRadius:10,overflow:"hidden"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,padding:"9px 10px",background:C.g50,borderBottom:`1px solid ${C.g100}`}}>
              <div style={{fontSize:12,fontWeight:800,color:C.navy}}>เลือกนักเรียน ({selectedStudentIds.length}/{invoiceStudents.length})</div>
              <button type="button" disabled={invoiceStudentsLoading||!!invoiceStudentsError||!selectedStudentIds.length} onClick={()=>setSelectedStudentIds([])} style={{border:"none",background:"transparent",color:C.navy,fontSize:12,fontWeight:800,cursor:"pointer"}}>
                ยกเลิกที่เลือก
              </button>
            </div>
            <input aria-label="ค้นหานักเรียนผู้รับใบแจ้งยอด" value={invoiceStudentSearch} onChange={e=>setInvoiceStudentSearch(e.target.value)} placeholder="ค้นหาชื่อหรือเลขที่นักเรียน" style={{width:"100%",padding:10,border:"none",borderBottom:`1px solid ${C.g200}`,fontSize:14}}/>
            <div style={{maxHeight:230,overflowY:"auto",padding:"4px 10px"}}>
              {invoiceStudentsLoading?<div role="status" style={{padding:12}}>กำลังโหลดรายชื่อนักเรียน...</div>:invoiceStudentsError?<div role="alert" style={{padding:12,color:C.red,fontSize:13}}>{invoiceStudentsError}<button type="button" onClick={()=>setInvoiceStudentReload(n=>n+1)} style={{display:"block",marginTop:8,padding:8}}>ลองใหม่</button></div>:invoiceStudents.length===0?<div style={{padding:12,textAlign:"center",fontSize:12,color:C.g400}}>ไม่พบนักเรียนในห้องนี้ กรุณาตรวจสอบห้องเรียนและสิทธิ์เข้าถึงข้อมูล</div>:visibleInvoiceStudents.length===0?<div style={{padding:12,fontSize:12,color:C.g400}}>ไม่พบชื่อที่ค้นหา</div>:visibleInvoiceStudents.map((s,i)=>{
                const id=String(s.id),checked=selectedStudentIds.includes(id);
                return <label key={s.id} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 2px",borderBottom:i<invoiceStudents.length-1?`1px solid ${C.g100}`:"none",cursor:"pointer"}}>
                  <input type="checkbox" checked={checked} onChange={()=>setSelectedStudentIds(p=>checked?p.filter(x=>x!==id):[...p,id])} style={{width:18,height:18,accentColor:C.navy}}/>
                  <span style={{width:28,fontSize:12,color:C.g400}}>#{s.student_no||"-"}</span>
                  <span style={{fontSize:13,fontWeight:700,color:C.g800}}>{s.full_name}</span>
                </label>;
              })}
            </div>
          </div>}
          <input value={createForm.description} onChange={e=>setCreateForm(p=>({...p,description:e.target.value}))} placeholder="รายการค่าใช้จ่าย" style={{padding:10,borderRadius:10,border:`1.5px solid ${C.g200}`,fontSize:14}}/>
          <div style={{display:"flex",gap:8}}>
            <input type="number" min="0" value={createForm.amount} onChange={e=>setCreateForm(p=>({...p,amount:e.target.value}))} placeholder="จำนวนเงิน" style={{minWidth:0,flex:1,padding:10,borderRadius:10,border:`1.5px solid ${C.g200}`,fontSize:14}}/>
            <input type="date" value={createForm.dueDate} onChange={e=>setCreateForm(p=>({...p,dueDate:e.target.value}))} style={{minWidth:0,flex:1,padding:10,borderRadius:10,border:`1.5px solid ${C.g200}`,fontSize:14}}/>
          </div>
          <div style={{fontSize:13,color:C.navy,fontWeight:700}}>เลือก {selectedStudentIds.length} คน · รวม {money(Number(createForm.amount||0)*selectedStudentIds.length)} บาท</div>
          <button onClick={createInvoices} disabled={busy==="create"||invoiceStudentsLoading||!!invoiceStudentsError||selectedStudentIds.length===0} style={{border:"none",background:busy==="create"||selectedStudentIds.length===0?C.g400:C.navy,color:C.white,borderRadius:10,padding:11,fontWeight:800,cursor:selectedStudentIds.length?"pointer":"not-allowed"}}>{busy==="create"?"กำลังสร้าง...":`สร้างใบแจ้งยอด (${selectedStudentIds.length} คน)`}</button>
        </div>
      </div>}
      {staffSection==="invoices"&&<div style={box}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <div style={{fontSize:14,fontWeight:800,color:C.navy}}>ใบแจ้งยอดที่สร้างแล้ว</div>
          <span style={{background:C.g100,color:C.g600,borderRadius:99,padding:"3px 9px",fontSize:11,fontWeight:800}}>{filteredStaffInvoices.length} รายการ</span>
        </div>
        <select value={invoiceClass} onChange={e=>setInvoiceClass(e.target.value)} style={{width:"100%",padding:9,border:`1.5px solid ${C.g200}`,borderRadius:9,background:C.white,fontSize:13,marginBottom:8}}>
          <option value="all">ทุกห้องเรียน</option>
          {classes.map(c=><option key={c.id} value={c.name}>{c.name}</option>)}
        </select>
        {filteredStaffInvoices.length===0?<Empty icon="🧾" msg="ยังไม่มีใบแจ้งยอดในห้องนี้"/>:filteredStaffInvoices.map((inv,i)=>(
          <div key={inv.id} style={{padding:"10px 0",borderBottom:i<filteredStaffInvoices.length-1?`1px solid ${C.g100}`:"none"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
              <div style={{minWidth:0}}>
                <div style={{fontWeight:700,fontSize:13,color:C.navy,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{inv.students?.full_name||"-"}</div>
                <div style={{fontSize:11,color:C.g400}}>{inv.students?.classes?.name||"-"} · เลขที่ {inv.students?.student_no||"-"} · {inv.fee_terms?.name||inv.invoice_no}</div>
              </div>
              <div style={{textAlign:"right",flexShrink:0}}>
                <div style={{fontWeight:800,fontSize:13,color:C.navy}}>฿{money(inv.total_amount)}</div>
                <div style={{marginTop:3}}>{badge(invoiceStatus(inv))}</div>
              </div>
            </div>
            {invoiceBalance(inv)}
            {invoiceItems(inv)}
            {cashControls(inv)}
            {!["draft","cancelled"].includes(inv.status)&&addItemForm?.invoiceId!==inv.id&&<button disabled={!!busy} onClick={()=>{setError("");setAddItemMessage("");setAddItemForm({invoiceId:inv.id,description:"ค่าเรียนพิเศษค้างชำระ",amount:"",reason:"",requestId:crypto.randomUUID()});}} style={{marginTop:10,padding:"8px 10px",border:`1px solid ${C.navy}`,borderRadius:8,background:C.white,color:C.navy,fontWeight:800}}>＋ เพิ่มรายการค้างชำระ</button>}
            {addItemForm?.invoiceId===inv.id&&<div style={{marginTop:12,paddingTop:12,borderTop:`1px solid ${C.g200}`,display:"grid",gap:8}}>
              <label style={{fontSize:12,color:C.navy}}>ชื่อรายการ<input aria-label="ชื่อรายการเพิ่ม" maxLength={200} disabled={busy==="add-item"} value={addItemForm.description} onChange={e=>setAddItemForm(p=>({...p,description:e.target.value,requestId:crypto.randomUUID()}))} style={{width:"100%",padding:10,border:`1px solid ${C.g200}`,borderRadius:8,marginTop:4}}/></label>
              <label style={{fontSize:12,color:C.navy}}>จำนวนเงิน (บาท)<input aria-label="จำนวนเงินเพิ่ม" type="number" min="0.01" step="0.01" disabled={busy==="add-item"} value={addItemForm.amount} onChange={e=>setAddItemForm(p=>({...p,amount:e.target.value,requestId:crypto.randomUUID()}))} style={{width:"100%",padding:10,border:`1px solid ${C.g200}`,borderRadius:8,marginTop:4}}/></label>
              <label style={{fontSize:12,color:C.navy}}>เหตุผล / หมายเหตุ (ถ้ามี)<textarea aria-label="เหตุผลเพิ่มรายการ" maxLength={1000} disabled={busy==="add-item"} value={addItemForm.reason} onChange={e=>setAddItemForm(p=>({...p,reason:e.target.value,requestId:crypto.randomUUID()}))} style={{width:"100%",padding:10,border:`1px solid ${C.g200}`,borderRadius:8,marginTop:4,resize:"vertical"}}/></label>
              <div style={{fontSize:13,fontWeight:700,color:C.navy}}>ยอดรวมใหม่ ฿{money(Number(inv.total_amount)+Math.max(0,Number(addItemForm.amount)||0))}<br/>คงเหลือใหม่ ฿{money(Math.max(0,Number(inv.total_amount)+Math.max(0,Number(addItemForm.amount)||0)-Number(inv.paid_amount)))}</div>
              <div style={{display:"flex",gap:8}}><button disabled={!!busy} onClick={addInvoiceItem} style={{flex:1,padding:10,border:0,borderRadius:8,background:C.navy,color:C.white,fontWeight:800}}>{busy==="add-item"?"กำลังบันทึก...":"บันทึกรายการเพิ่ม"}</button><button disabled={!!busy} onClick={()=>setAddItemForm(null)} style={{padding:10,border:`1px solid ${C.g200}`,borderRadius:8,background:C.white,color:C.navy}}>ยกเลิก</button></div>
            </div>}
            {reviewPayments(inv)}
          </div>
        ))}
      </div>}
      {staffSection==="manage"&&(payments.length===0?<div style={box}><Empty icon="✅" msg="ไม่มีรายการรอตรวจสอบ"/></div>:payments.map(p=>(
        <div key={p.id} style={box}>
          <div style={{display:"flex",justifyContent:"space-between",gap:10}}>
            <div><div style={{fontWeight:800,color:C.navy}}>{p.student_invoices?.students?.full_name}</div>
            <div style={{fontSize:12,color:C.g400}}>{p.student_invoices?.students?.classes?.name} · {p.student_invoices?.invoice_no}</div></div>
            <div style={{fontSize:18,fontWeight:800,color:C.yellow}}>฿{money(p.amount)}</div>
          </div>
          <div style={{fontSize:12,color:C.g600,marginTop:8}}>แจ้งชำระ {new Date(p.paid_at).toLocaleString("th-TH")}</div>
          <div style={{display:"flex",gap:8,marginTop:12}}>

            </div>;

        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
          {[

            {label:"รอตรวจ",value:counts.pending,color:C.yellow,bg:C.yellowL},
            {label:"ชำระแล้ว",value:counts.paid,color:C.green,bg:C.greenL}
          ].map(x=><div key={x.label} style={{background:x.bg,borderRadius:12,padding:"12px 6px",textAlign:"center"}}><div style={{fontSize:20,fontWeight:800,color:x.color}}>{x.value}</div><div style={{fontSize:11,fontWeight:700,color:x.color}}>{x.label}</div></div>)}
        </div>

        const invPayments=payments.filter(p=>p.invoice_id===inv.id);
        return <div key={inv.id} style={box}>

function StudentHome({token,profile,studentId,studentInfo,onPageChange}){
  const [data,setData]=useState({att:[],grades:[],ann:[]});const [loading,setLoading]=useState(true);
  const [talkUnread,setTalkUnread]=useState(0);
  useEffect(()=>{
    const load=async()=>{
      let sid=studentId;
      if(!sid){const s=await sbFetch(`students?profile_id=eq.${profile.id}&select=*`,{token}).catch(()=>[]);sid=s?.[0]?.id;}
      if(!sid){setLoading(false);return;}
      const range=attendanceRangeForClass(studentInfo?.classes?.name);
      const [a,g,n]=await Promise.all([
        sbFetch("rpc/get_derived_attendance",{method:"POST",token,body:JSON.stringify({p_student_id:sid,p_date_from:range.from,p_date_to:range.to})}).catch(()=>[]),
        sbFetch(`grades?student_id=eq.${sid}&select=*&order=created_at.desc`,{token}).catch(()=>[]),
        sbFetch("announcements?select=*&order=pinned.desc,created_at.desc&limit=3",{token}).catch(()=>[]),
      ]);
      setData({att:filterAttendanceByRange(a,range),grades:g||[],ann:n||[]});setLoading(false);
    };load();
  },[token,profile,studentId]);
  useEffect(()=>{
    if(!studentId||!["parent","teacher_parent"].includes(profile?.role))return;
    let active=true;
    const refreshUnread=async()=>{
      const [talk,tuition]=await Promise.all([
        sbFetch(`parent_teacher_messages?student_id=eq.${studentId}&sender_id=neq.${profile.id}&parent_read_at=is.null&select=id`,{token}).catch(()=>[]),
        sbFetch(`tuition_parent_notifications?student_id=eq.${studentId}&parent_id=eq.${profile.id}&read_at=is.null&select=id`,{token,parseCount:true,headers:{Prefer:"count=exact"}}).catch(()=>({count:0,data:[]}))
      ]);
      if(active)setTalkUnread((talk||[]).length+(tuition.count??tuition.data?.length??0));
    };
    refreshUnread();
    const timer=setInterval(refreshUnread,30000);
    window.addEventListener("focus",refreshUnread);
    return()=>{active=false;clearInterval(timer);window.removeEventListener("focus",refreshUnread);};
  },[token,studentId,profile.id,profile.role]);
  if(loading)return <Spin/>;
  const sum={present:0,late:0,absent:0,leave:0};data.att.forEach(a=>{if(sum[a.status]!==undefined)sum[a.status]++;});
  const pct=data.att.length>0?Math.round(((sum.present+sum.late)/data.att.length)*100):0;
  const isParent=["parent","teacher_parent"].includes(profile?.role);
  const displayName=isParent?(studentInfo?.full_name||profile?.full_name):(profile?.full_name||studentInfo?.full_name);
  const menus=[
    {id:"att",icon:"📅",label:tx("การมาเรียน","Attendance"),bg:"linear-gradient(135deg,#16a34a,#22c55e)",action:()=>onPageChange("attend")},
    {id:"hist",icon:"🕐",label:tx("ประวัติสแกน","Scan history"),bg:"linear-gradient(135deg,#0f766e,#0d9488)",action:()=>onPageChange("checkin")},
    ...(isParent?[{id:"schedule",icon:"🗓️",label:tx("ตารางสอน","Timetable"),bg:"linear-gradient(135deg,#2563eb,#3b82f6)",action:()=>onPageChange("schedule")}]:[]),
    {id:"grade",icon:"📊",label:tx("ผลการเรียน","Grades"),bg:"linear-gradient(135deg,#7c3aed,#8b5cf6)",action:()=>onPageChange("grades")},
    {id:"ann",icon:"📢",label:tx("ประกาศ","Announcements"),bg:`linear-gradient(135deg,${C.gold},${C.goldL})`,action:()=>onPageChange("announce")},
    ...(isParent?[{id:"talk",icon:"💬",label:tx("พูดคุย","Talk"),bg:"linear-gradient(135deg,#0891b2,#06b6d4)",badge:talkUnread,action:()=>onPageChange("talk")}]:[]),
    ...(isParent?[{id:"assessment",icon:"🏆",label:tx("แบบสอบถาม","Questionnaires"),bg:"linear-gradient(135deg,#db2777,#f59e0b)",action:()=>onPageChange("assessment")}]:[]),
    {id:"exam",icon:"📋",label:tx("ผลสอบ","Exam results"),bg:"linear-gradient(135deg,#0369a1,#0ea5e9)",action:()=>onPageChange("exam")},
    {id:"tuition",icon:"💰",label:tx("ค่าเทอม","Tuition"),bg:"linear-gradient(135deg,#b45309,#d97706)",action:()=>onPageChange("tuition")},
    {id:"leave",icon:"📝",label:tx("แจ้งลาเรียน","Leave request"),bg:"linear-gradient(135deg,#ea580c,#f97316)",action:()=>onPageChange("leave")},
  ];
  return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      {/* Profile banner */}
      <div style={{background:`linear-gradient(135deg,${C.navyD},${C.navy})`,borderRadius:20,padding:20,display:"flex",alignItems:"center",gap:14,position:"relative",overflow:"hidden"}}>
        <div style={{position:"absolute",right:-10,top:-10,width:100,height:100,borderRadius:99,background:"rgba(201,162,39,0.12)"}}/>
        {studentInfo?.photo_path
          ? <StudentAvatar path={studentInfo.photo_path} token={token} size={58} fallback={isParent?"👪":"👩‍🎓"}/>
          : <div style={{width:58,height:58,borderRadius:99,background:C.goldP,border:`3px solid ${C.gold}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:28,flexShrink:0}}>{isParent?"👪":"👩‍🎓"}</div>}
        <div>
          <div style={{color:"rgba(255,255,255,0.7)",fontSize:12}}>{isParent?tx("บุตรหลาน","Child"):tx("นักเรียน","Student")}</div>
          <div style={{color:C.gold,fontSize:17,fontWeight:800}}>{displayName}</div>
          <div style={{color:"rgba(255,255,255,0.6)",fontSize:12}}>เลขที่ {studentInfo?.student_no||"—"} · {studentInfo?.classes?.name||"—"}</div>
        </div>
      </div>
      {/* สรุป */}
      <div style={{display:"flex",gap:10}}>
        {[{v:`${pct}%`,l:"มาเรียน",c:pct>=80?C.green:C.yellow},{v:data.grades.length,l:"วิชา",c:C.navy},{v:sum.absent,l:"ขาดเรียน",c:C.red}].map(x=>(
          <div key={x.l} style={{flex:1,background:C.white,borderRadius:14,padding:"12px 8px",textAlign:"center",boxShadow:"0 2px 6px rgba(0,0,0,0.07)"}}>
            <div style={{fontSize:20,fontWeight:800,color:x.c}}>{x.v}</div>
            <div style={{fontSize:11,color:C.g400,marginTop:2}}>{x.l}</div>
          </div>
        ))}
      </div>
      {/* เมนู */}
      <div style={{background:C.white,borderRadius:20,padding:16,boxShadow:"0 2px 8px rgba(0,0,0,0.07)"}}>
        <div style={{fontSize:14,fontWeight:700,color:C.navy,marginBottom:14}}>{tx("เมนูหลัก","Main menu")}</div>
        <Grid items={menus}/>
      </div>
      {/* ประกาศ */}
      {data.ann.length>0&&<div style={{background:C.white,borderRadius:16,padding:14,boxShadow:"0 2px 8px rgba(0,0,0,0.07)"}}>
        <div style={{fontSize:13,fontWeight:700,color:C.navy,marginBottom:10}}>📢 ประกาศล่าสุด</div>
        {data.ann.map((a,i)=><div key={a.id} style={{padding:"10px 0",borderBottom:i<data.ann.length-1?`1px solid ${C.g100}`:"none"}}><div style={{fontWeight:700,fontSize:13,color:C.g900,lineHeight:1.4}}>{a.pinned?"📌 ":""}{a.title}</div><div style={{fontSize:11,color:C.g400,fontWeight:700,marginTop:3}}>🗓️ {formatThaiDate(a.created_at)}</div>{a.body&&<div style={{fontSize:12,color:C.g600,marginTop:6,lineHeight:1.55,whiteSpace:"pre-line",display:"-webkit-box",WebkitLineClamp:4,WebkitBoxOrient:"vertical",overflow:"hidden"}}>{a.body}</div>}{a.image_path&&<img src={announcementImagePublicUrl(a.image_path)} alt="" style={{width:"100%",height:"auto",maxHeight:180,objectFit:"cover",borderRadius:10,marginTop:8,border:`1px solid ${C.g100}`}}/>}</div>)}
      </div>}
    </div>
  );
}

      setClasses(cls||[]);setForms(fs||[]);setResults(rs||[]);

  },[token,entry.form_id]);
  const update=(k,v)=>setForm(p=>({...p,[k]:v}));
  async function saveForm(){
    if(!staff)return;
    setMsg("");
    if(!form.title.trim()||!form.class_id)return setMsg("กรุณากรอกชื่อแบบประเมินและเลือกห้องเรียน");
    if(selectedIds.length===0)return setMsg("กรุณาเลือกนักเรียนที่เข้าร่วมกิจกรรมอย่างน้อย 1 คน");
    setSaving(true);
    try{
      const questions=parseLines(form.type==="observation"?form.rubric:form.questions);
      const created=await sbFetch("assessment_forms",{method:"POST",token,body:JSON.stringify({
        type:form.type,title:form.title.trim(),level:form.level.trim(),activity_date:form.activity_date,
        audience:form.type==="project"?form.audience:"teacher",status:"active",created_by:profile.id,
        config:{goal:form.goal,questions,rubric:parseLines(form.rubric),scale:["มากที่สุด","มาก","ปานกลาง","น้อย","ควรส่งเสริม"],max_score:Number(form.max_score)||100}
      })});
      const newId=created?.[0]?.id;
      if(newId){
        await sbFetch("assessment_participants",{method:"POST",token,body:JSON.stringify(selectedIds.map(id=>({form_id:newId,student_id:Number(id),class_id:Number(form.class_id)})))});
      }
      setMsg("บันทึกแบบประเมินและรายชื่อนักเรียนเรียบร้อย");
      await load();
    }catch(e){setMsg(e.message||"บันทึกไม่สำเร็จ");}
    finally{setSaving(false);}
  }
  async function saveResult(){
    setMsg("");
    if(!entry.form_id||!entry.student_id)return setMsg("เลือกแบบประเมินและนักเรียนก่อน");
    const f=forms.find(x=>String(x.id)===String(entry.form_id));
    const payload=f?.type==="observation"?{checks:entry.checks,note:entry.note}:{score:Number(entry.score)||0,max_score:f?.config?.max_score||Number(form.max_score)||100,note:entry.note};
    setSaving(true);
    try{
      await sbFetch("assessment_results",{method:"POST",token,body:JSON.stringify({form_id:Number(entry.form_id),student_id:Number(entry.student_id),submitted_by:profile.id,answers:payload,score:payload.score??null,note:entry.note})});
      setEntry({form_id:entry.form_id,student_id:"",score:"",note:"",checks:{}});
      setMsg("บันทึกผลเรียบร้อย");
      await load();
    }catch(e){setMsg(e.message||"บันทึกผลไม่สำเร็จ");}
    finally{setSaving(false);}
  }
  const activeForms=forms.filter(f=>f.status!=="archived");
  const entryForm=forms.find(f=>String(f.id)===String(entry.form_id));
  const reportRows=forms.map(f=>{
    const r=results.filter(x=>x.form_id===f.id);
    const scored=r.filter(x=>x.score!==null&&x.score!==undefined);
    const avg=scored.length?Math.round(scored.reduce((a,b)=>a+Number(b.score||0),0)/scored.length*10)/10:null;
    return {...f,result_count:r.length,avg};
  });
  if(loading)return <Spin/>;
  return <div style={{display:"flex",flexDirection:"column",gap:12}}>
    <div style={{background:`linear-gradient(135deg,${C.navyD},${C.navy})`,borderRadius:18,padding:18,color:C.white}}>
      <div style={{fontSize:12,color:"rgba(255,255,255,0.7)",fontWeight:800}}>ระบบประเมินครบวงจร</div>
      <div style={{fontSize:21,fontWeight:900,color:C.gold,marginTop:3}}>ศูนย์ประเมินอนุบาลและประถม</div>
      <div style={{fontSize:12,lineHeight:1.6,color:"rgba(255,255,255,0.72)",marginTop:7}}>สร้างแบบสอบถามผู้ปกครอง/นักเรียน บันทึกแบบสังเกตครู ใส่คะแนนแบบทดสอบ และสรุปรายงานรายโครงการในที่เดียว</div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:7}}>
      {[["build","ออกแบบ"],["forms","คลังแบบ"],["record","บันทึกผล"],["report","รายงาน"]].map(x=><button key={x[0]} onClick={()=>setTab(x[0])} style={{...smallBtn,background:tab===x[0]?C.navy:C.white,color:tab===x[0]?C.white:C.navy,border:`1px solid ${tab===x[0]?C.navy:C.g200}`}}>{x[1]}</button>)}
    </div>
    {msg&&<div style={{padding:"10px 12px",borderRadius:10,background:msg.includes("เรียบร้อย")?C.greenL:C.yellowL,color:msg.includes("เรียบร้อย")?C.green:C.yellow,fontSize:13,fontWeight:800}}>{msg}</div>}
    {tab==="build"&&<div style={card}>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:10}}>
        {Object.entries(ASSESSMENT_TYPES).map(([k,v])=><button key={k} onClick={()=>update("type",k)} style={{...smallBtn,background:form.type===k?v.color:C.g100,color:form.type===k?C.white:C.g700}}>{v.icon}<br/><span style={{fontSize:11}}>{v.label}</span></button>)}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
        <input style={field} value={form.title} onChange={e=>update("title",e.target.value)} placeholder="ชื่อโครงการ/กิจกรรม/แบบทดสอบ"/>
        <input style={field} value={form.level} onChange={e=>update("level",e.target.value)} placeholder="ระดับชั้น เช่น อ.1-ป.6"/>
        <input style={field} type="date" value={form.activity_date} onChange={e=>update("activity_date",e.target.value)}/>
        <select style={field} value={form.class_id} onChange={e=>update("class_id",e.target.value)}><option value="">เลือกห้องเรียน</option>{classes.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select>
      </div>
      {form.type==="project"&&<select style={{...field,marginTop:8}} value={form.audience} onChange={e=>update("audience",e.target.value)}><option value="parents">ผู้ปกครองตอบเท่านั้น</option><option value="students">นักเรียนตอบ</option><option value="both">ผู้ปกครองและนักเรียน</option></select>}
      <textarea style={{...field,marginTop:8,minHeight:72}} value={form.goal} onChange={e=>update("goal",e.target.value)} placeholder="เป้าหมาย/ตัวชี้วัด/สิ่งที่ต้องการสรุป"/>
      <textarea style={{...field,marginTop:8,minHeight:116}} value={form.type==="observation"?form.rubric:form.questions} onChange={e=>update(form.type==="observation"?"rubric":"questions",e.target.value)} placeholder="ใส่รายการประเมิน บรรทัดละ 1 ข้อ"/>
      {form.type==="test"&&<input style={{...field,marginTop:8}} type="number" value={form.max_score} onChange={e=>update("max_score",e.target.value)} placeholder="คะแนนเต็ม"/>}
      {students.length>0&&<div style={{marginTop:10,border:`1px solid ${C.g200}`,borderRadius:12,overflow:"hidden"}}>
        <button onClick={()=>setSelected(Object.fromEntries(students.map(s=>[s.id,selectedIds.length!==students.length])))} style={{width:"100%",border:"none",background:C.g100,padding:10,textAlign:"left",fontWeight:900,color:C.navy}}>นักเรียนเข้าร่วม {selectedIds.length}/{students.length} คน</button>
        <div style={{maxHeight:220,overflow:"auto",padding:8,display:"grid",gap:6}}>
          {students.map(s=><label key={s.id} style={{display:"flex",alignItems:"center",gap:9,padding:"8px 9px",background:C.g50,borderRadius:9,fontSize:13,color:C.g700}}><input type="checkbox" checked={!!selected[s.id]} onChange={e=>setSelected(p=>({...p,[s.id]:e.target.checked}))}/><b style={{color:C.navy,width:32}}>#{s.student_no||"-"}</b>{s.full_name}</label>)}
        </div>
      </div>}
      <button onClick={saveForm} disabled={saving} style={{...smallBtn,width:"100%",marginTop:10,background:saving?C.g400:C.navy,color:C.white,fontSize:15}}>{saving?"กำลังบันทึก...":"สร้างแบบประเมินพร้อมรายชื่อนักเรียน"}</button>
    </div>}
    {tab==="forms"&&<div style={{display:"grid",gap:9}}>{activeForms.length===0?<Empty icon="📋" msg="ยังไม่มีแบบประเมิน"/>:activeForms.map(f=><div key={f.id} style={card}>

    </div>)}</div>}
    {tab==="record"&&<div style={card}>
